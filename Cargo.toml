[package]
name = "attestation-parser-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
x509-cert = { version = "0.2", features = ["std"] }
der = { version = "0.7", features = ["std", "oid"] }
spki = "0.7"
ecdsa = "0.16"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
rsa = { version = "0.9", features = ["std", "pem"] }
sha2 = { version = "0.10", features = ["oid"] }
digest = "0.10"
signature = "2.2"
ciborium = "0.2"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pem = "3"
const-oid = "0.9"
ureq = "2"
